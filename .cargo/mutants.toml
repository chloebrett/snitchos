# Exclude kernel crates from mutation — they target RISC-V (no_std) and
# cannot be compiled or tested on the host. Use `cargo xtask mutants`
# (which passes -p collector -p protocol) rather than bare `cargo mutants`.
#
# `snemu-wasm/src/shell.rs` is the `#[wasm_bindgen]` boundary. It compiles for the
# host, but nothing on the host *calls* it: its only callers are the `wasm32` tests
# in `snemu-wasm/tests/wasm.rs`, which run under `wasm-pack test --node` and not in
# any harness cargo-mutants drives. Every mutant there is reported missed for that
# reason alone, which is noise rather than signal — the same situation as the kernel
# crates and stitch's `RuntimePlatform` below.
#
# What makes this safe rather than a hole: the shell is *required* to hold no logic,
# and that requirement is enforced by tests, not by intent. See
# `shell::tests::the_bindgen_layer_contains_no_control_flow` — if a decision ever
# lands in this file the guard fails, and the fix is to move it into `budget`,
# `cursor` or `telemetry`, all of which are mutated normally.
exclude_globs = ["kernel/**", "snemu-wasm/src/shell.rs"]

# The warned_no_hello flag gates a one-shot stderr warning; testing it
# would require capturing stderr. Not worth the complexity.
exclude_re = [
  # One-shot stderr warning; testing it requires capturing stderr.
  "delete ! in State::handle",
  # Equivalent mutant: `first_t = t` when `t == first_t` is a no-op.
  "replace < with <= in State::advance_anchor",
  # Equivalent mutants in mmu.rs: R,W,X,G are bits 1,2,3,5 (disjoint),
  # so | and ^ produce the same value in rwxg().
  "replace \\| with \\^ in PtePerms::rwxg",
  # Equivalent mutants: PPN occupies bits 53:10 and flag bits are 7:0 —
  # structurally disjoint for any page-aligned PA, so | and ^ are identical.
  "replace \\| with \\^ in leaf_pte",
  "replace \\| with \\^ in branch_pte",
  # Equivalent mutant: 1 << 0 == 1 >> 0 == 1 — same constant either way.
  "replace << with >> in leaf_pte",
  # No viable mutant: cargo-mutants' only operator for these IPC transition
  # functions is whole-body -> (Default::default(), ...), but their return
  # tuples include a type with no Default (RendezvousAction / TaskId), so
  # every such mutant is unviable. The transitions are instead pinned by
  # exhaustive exact-equality tests in ipc::tests (both directions x
  # Idle/queued, FIFO order, collapse-to-Idle, and the never-both invariant).
  "replace on_send ->",
  "replace on_receive ->",
  "replace drain_front ->",
  # Equivalent mutants in stitch rights_glyphs: within a category the rights
  # are disjoint bits (RECV|WAIT for read, EMIT|SEND|SIGNAL for write), so
  # `rights & (A | B)` and `rights & (A ^ B)` mask the same value.
  "replace \\| with \\^ in rights_glyphs",
  # Equivalent mutant in kernel-net ip_checksum: the word assembly is
  # `(hi << 8) | lo` where `hi << 8` occupies bits 15:8 and `lo` (a u8)
  # occupies bits 7:0 — disjoint by construction, so | and ^ are identical.
  "replace \\| with \\^ in ip_checksum",
  # Equivalent mutant in fs-proto Badge::pack: inode occupies bits [0..32)
  # and rights [32..48) — disjoint by construction, so | and ^ are identical.
  "replace \\| with \\^ in Badge::pack",
  # Equivalent mutant in fs-proto Denial::pack: same shape as Badge::pack —
  # inode [0..32), attempted right [32..48), disjoint, so | and ^ are identical.
  "replace \\| with \\^ in Denial::pack",
  # Equivalent mutant in ramfs write: the `if file.len() < end` guard avoids
  # truncation before `resize(end, 0)`. At len == end, resize is a no-op, so
  # `<` and `<=` are behaviourally identical.
  "replace < with <= in <impl Filesystem for RamFs>::write",
  # Non-deterministic: random_trace_id uses fastrand and its output cannot
  # be asserted. The linter rewrites #[mutants::skip] to
  # #[cfg_attr(test, mutants::skip)] which cargo-mutants doesn't see, so
  # we exclude via pattern instead.
  "replace random_trace_id ->",
  # Target-only edge code: stitch's RuntimePlatform is #[cfg(target_os =
  # "none")] (console I/O over real syscalls), so it isn't compiled on the
  # host and can't be mutation-tested there — same situation as the kernel
  # crates and RuntimeTelemetry. Exercised by on-target itests instead.
  "RuntimePlatform",
  # Equivalent mutant in snemu-wasm's probe: the operand is a
  # `Vec::with_capacity` argument, and capacity is a performance hint with no
  # observable effect — the vector is filled by `extend_from_slice` either way,
  # so `*` and `+` produce byte-identical results.
  "replace \\* with \\+ in run",
]
