[package]
name = "xtask-cram"
version = "0.0.1"
edition = "2024"
publish = false
# Training is the common case; the analysis bins are opt-in by name.
default-run = "xtask-cram"

# The `cram`-linked half of xtask, split for the same reason `xtask-itest` is
# split from `xtask`: an edit to the trainer should recompile it once, for this
# tool, rather than dragging the lean `cargo xtask test` path along with it.
# Lean `xtask` forwards `cram` here via `cargo run -p xtask-cram`.
[dependencies]
cram = { path = "../cram" }
cram-corpus = { path = "../cram-corpus" }
# The scoring path. `--eval` is a mode of this tool rather than its own binary,
# so the floor rows and a checkpoint's row are always printed together.
cram-eval = { path = "../cram-eval" }
# The generation harness — the model call and the candidate funnel. Lives here
# rather than in lean `xtask` so an edit to it does not recompile the tool that
# runs `cargo xtask test`.
cram-gen = { path = "../cram-gen" }
kvetch-model = { path = "../kvetch-model" }
kvetch-vocab = { path = "../kvetch-vocab" }
# The parser that judges whether sampled output is legal Stitch.
stitch = { path = "../stitch" }

[lints]
workspace = true
