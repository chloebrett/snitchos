[package]
name = "xtask-board"
version = "0.0.1"
edition = "2024"
publish = false

# The serial-linked half of `cargo xtask board` — the host bridge that drives the
# VisionFive 2 (see plans/board-bridge.md). Split out for the same reason as
# `xtask-itest` and `xtask-cram`: lean `xtask` runs the gate, and an edit to the
# bridge must not recompile the tool that runs `cargo xtask test`.
[dependencies]
# `collector::serial` — `call_out_alternative` and `SerialReader`, the two pieces
# the collector's `--serial` source already proved. `default-features = false` is
# load-bearing: the `native` feature pulls `ureq` (→ `ring`) and `tiny_http`, and
# a bridge over a serial cable has no business compiling a web server. The serial
# module is deliberately not `native`-gated so this works — see its module docs.
collector = { path = "../collector", default-features = false }
# The wire format. `features = ["std"]` is what turns on `protocol::stream` —
# `try_decode_frame` and `OwnedFrame`, which the two-phase splitter is built on.
protocol = { path = "../protocol", features = ["std"] }

[dev-dependencies]
# Test fixtures are built with `protocol::wire_encode` over real `Frame`s rather
# than hand-typed byte arrays, so they stay true if the encoding changes. Naming
# a `CapEvent`'s fixed-size name field needs `CAP_NAME_LEN`.
snitchos-abi = { path = "../abi" }

[lints]
workspace = true

[lib]
# No doctests in this crate; doctest=false keeps `cargo test` off the slow
# rustdoc doc-test compile. The gate runs nextest (never runs doctests) — see
# CLAUDE.md "use nextest". Add doctest=false to any new lib crate too.
doctest = false
