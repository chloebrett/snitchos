[package]
name = "kvetch-vocab"
version = "0.0.1"
edition = "2024"
publish = false

# No dependencies, deliberately. This crate is linked by the on-target kvetch
# runner *and* by the host-side `cram` training pipeline, and it is the one
# artifact every rung of the ladder shares byte-for-byte. A dependency here is a
# dependency in the kernel's userspace, so the bar is: none.
[dependencies]

[lints]
workspace = true

[lib]
doctest = false
