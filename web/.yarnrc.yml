# Yarn 4 defaults to Plug'n'Play, which still trips tooling that expects to walk
# node_modules — Playwright's browser resolution and some Vite plugins among them.
# The node-modules linker keeps Yarn 4's speed and lockfile without that class of
# breakage. Revisit if PnP compatibility stops being a live concern.
nodeLinker: node-modules

# No `yarnPath`: the version is pinned by `packageManager` in package.json and
# resolved by corepack, so there is no binary to commit and no second place for the
# version to drift.
