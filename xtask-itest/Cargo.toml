[package]
name = "xtask-itest"
version = "0.0.1"
edition = "2024"
publish = false

# The snemu-linked half of xtask: the integration-test runner (`itest`), the
# snemu emulator tooling (`snemu diff|bench|profile`), and baseline management.
# Split out of `xtask` so the lean tool (`test`/`clippy`/`build`/…) no longer
# links `snemu` — see plans/xtask-lean-test-binary.md. Lean `xtask` delegates
# the commands here via `cargo run -p xtask-itest --`.
[dependencies]
clap = { version = "4", features = ["derive"] }
# The tour's chapter contract. This crate boots; `tour` judges — so there is one
# definition of what a chapter claims, shared with the browser.
tour = { path = "../tour" }
magnitude = { path = "../magnitude" }
# `diagram_cmd` lives here: its telemetry targets fold snemu frames and its
# itest-matrix target reads the `itest::SCENARIOS` registry, both of which are in
# this crate. The drift check runs as a test (see diagram_drift_tests).
diagram = { path = "../diagram" }
protocol = { path = "../protocol", features = ["std"] }
snitchos-abi = { path = "../abi" }
fs-proto = { path = "../fs-proto" }
# The `kvetch-babble-serves` scenario recomputes, host-side, exactly what the
# on-target server should have produced — same seed derivation, same sampler,
# same tables. Byte-identity between the two is the assertion.
kvetch-proto = { path = "../kvetch-proto" }
babble = { path = "../babble" }
stitch = { path = "../stitch" }
# ...and the same for the trained rung: `kvetch-drivel-serves` recomputes the
# completion from the committed checkpoint, so the assertion is byte-identity
# rather than "a completion appeared".
kvetch-serve = { path = "../kvetch-serve" }
kvetch-model = { path = "../kvetch-model" }
kvetch-vocab = { path = "../kvetch-vocab" }
itest-harness = { path = "../itest-harness" }
xtask-qemu = { path = "../xtask-qemu" }
xtask-snemu = { path = "../xtask-snemu" }
# The snemu emulator itself — the itest harness drives a `Machine` directly.
snemu = { path = "../snemu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"

[lints]
workspace = true
