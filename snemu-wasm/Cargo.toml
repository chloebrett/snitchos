[package]
name = "snemu-wasm"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# The emulator core. This crate is a *second embedder* of it, alongside
# `itest-harness` — it holds a `Machine` and drives `step()`. Nothing here
# reaches into snemu's internals; if it needs to, that's a signal the API is
# missing something rather than a licence to widen this crate.
snemu = { path = "../snemu" }

# Telemetry decode. The page renders `Frame`s, not raw virtio bytes, so the
# `std` stream decoder (`protocol::stream`) is the point of the dependency.
protocol = { path = "../protocol", features = ["std"] }

# The JS boundary. Unconditional rather than scoped to wasm32: the
# `#[wasm_bindgen]` shell must still *compile* for the host, because the host is
# where its logic is tested. Nothing in the browser-only path may live outside
# that shell.
wasm-bindgen = "0.2"

# The page's data shapes. `Status` and `FrameView` cross into JS as JSON, because a
# `#[wasm_bindgen]` method cannot return an enum with payloads and hand-rolling that
# conversion is precisely the logic the shell must not carry. Deriving `Serialize`
# keeps the shell a one-liner and puts the shape under test.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The wasm32 test harness. `cargo test` cannot run on wasm32-unknown-unknown
# (no threads, no process exit), so `wasm-pack test --node` drives the tests
# through this instead. Dev-only: nothing shipped to the browser depends on it.
wasm-bindgen-test = "0.3"

# Read-only FDT parser — the same one the kernel uses. Tests that patch the device
# tree parse it back through the guest's own reader rather than trusting our writer.
fdt = "0.1.5"

# The kernel's own `workload=` parser. A dev-dependency so the curated workload list
# is checked against what the guest actually accepts, without the browser shim
# depending on a kernel crate at runtime.
kernel-boot = { path = "../kernel-boot" }

# `CAP_NAME_LEN` — the fixed width of a CapEvent's name array, for building test
# frames. Dev-only: the shim never constructs a frame in production, it decodes them.
snitchos-abi = { path = "../abi" }

# The folds the browser panels use. A dev-dependency here because the *store*'s
# contract is "a fold over my contents is still true", and the only honest way to
# assert that is to run a real fold over them.
diagram = { path = "../diagram" }

[lints]
workspace = true

[lib]
# `cdylib` is what wasm-pack links into a `.wasm` module; `rlib` is what lets
# this crate's own tests (and any host consumer) link it natively. The `rlib`
# half is load-bearing for TDD here — without it the pure core could only ever
# be exercised through a browser.
crate-type = ["cdylib", "rlib"]
doctest = false
