# Recipe axes for corpus generation, batch 10 — the diversity dimensions, as data.
#
# A sheet is frozen once a batch has been generated from it. `batch9.toml` is the
# record of what produced `corpora/batch9`, down to the wording its briefs were
# rendered with; this is a new file rather than an edit to that one, so a finding
# about that corpus can still be read back onto the axes that produced it.
# See `cram-gen/src/recipe.rs` and `plans/corpus-recipe-axes.md`.
#
# What changed from batch9, and why — `notes/batch9-findings.md`:
#
# - **500 domains rather than 100.** batch9 ran each domain ten times at the
#   *identical* crossing, so nine of every ten programs differed only by sampling
#   noise. Domain is the axis that moves the identifiers, and identifiers are
#   most of what a rung this size learns.
# - **Two crossings per domain, flattened pass-major.** A run sees all 500
#   domains before it sees any domain twice, and the second asking differs in
#   size and shape — a different program rather than a re-roll.
# - **`latitude = "hold"`.** Finding 1: parse-death is a monotone function of
#   program length, 16% in the shortest decile against 92% in the longest.
#   batch9's briefs ended "if the program naturally wants to be bigger, let it
#   be"; this one asks the model to cover the computation and stop.
# - **The size mix skews small** for the same reason. batch9's seed was 24 small
#   / 56 medium / 20 large; this one is roughly 55 / 35 / 10.
# - **Shapes are spread wider.** batch9's seed was 62 module / 14 server loop /
#   5 script / 11 library-with-heavy-tests, which under-represented `script`
#   badly enough that the axis was barely exercised.
# - **`subject = "shape"`.** batch9's briefs opened "Write a <domain> module"
#   and then said "Shape: a script" on the next line. That contradiction was
#   survivable while 62% of the sheet really was modules; with the shapes spread
#   it would be wrong more often than right, and reconciling two facts that
#   disagree is exactly where a small model fails.
#
# `clause` is the load-bearing field. A bare domain name lets a weak model
# default to the same records-plus-filter program every time; the clause names
# the actual computation, which is what makes `sauna booking` (interval overlap)
# and `library hold queue` (FIFO per title with expiry) diverge into genuinely
# different programs.
#
# The first 100 domains are batch9's, carried over with their clauses intact and
# re-crossed — including the eight Finding 4 named as zero-yield. They are kept
# deliberately: the finding is about what Stitch cannot express, and a smaller
# ask at a smaller size is a different experiment rather than the same one.

[policy]
latitude = "hold"
subject  = "shape"

[[recipe]]
domain    = "warehouse bin allocation"
clause    = "smallest bin that fits; fragmentation matters"
crossings = [
  { constructs = "prod, Map", size = "small", shape = "script" },
  { constructs = "prod, Map, Result+?", size = "medium", shape = "library-with-heavy-tests" },
]

