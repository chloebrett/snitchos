# Recipe axes for corpus generation — the diversity dimensions, as data.
#
# Generated from plans/corpus-recipe-axes.md, which stays the source of truth
# for *why* these are the axes. Edit there and regenerate, or edit here and
# keep the doc in step — but do not let them drift.
#
# `clause` is the load-bearing field. A bare domain name lets a weak model
# default to the same records-plus-filter program every time; the clause names
# the actual computation, which is what makes `sauna booking` (interval
# overlap) and `library hold queue` (FIFO per title with expiry) diverge into
# genuinely different programs.

[[recipe]]
domain     = "warehouse bin allocation"
